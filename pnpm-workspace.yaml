# Allowlist des dépendances autorisées à exécuter des scripts de build
# (pnpm 12 les bloque par défaut ; esbuild a besoin de son postinstall).
allowBuilds:
  "@prisma/client": false
  better-sqlite3: false
  esbuild: true

minimumReleaseAgeExclude:
  - lucide-react@1.79.0
  - "@react-pdf/font@4.1.3"
  - "@react-pdf/hyphenate@0.1.1"
  - "@react-pdf/image@3.1.3"
  - "@react-pdf/layout@5.2.1"
  - "@react-pdf/paginate@1.0.2"
  - "@react-pdf/render@4.7.1"
  - "@react-pdf/renderer@4.9.1"
  - "@react-pdf/stylesheet@6.3.3"
  - "@react-pdf/textkit@7.0.2"
  - "@react-pdf/types@2.14.1"
  - jay-peg@1.1.2

# Dépendances minimales (cahier des charges) : ne pas auto-installer les peers
# optionnels de better-auth (prisma, better-sqlite3, vue, svelte… inutiles ici).
autoInstallPeers: false

# Correctif runtime : uuid vulnérable (<11.1.1) tiré par exceljs.
overrides:
  "exceljs>uuid": "11.1.1"
